<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC形式 練習問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool: calm, exact, encouraging
   IDEA a Japanese mark sheet: orange-ink ovals, ruled rows, a pencil-black fill
   PICTURE the live question card with big oval bubbles, beside the answer sheet that fills as you go
   COLOUR white paper, graphite ink, mark-sheet orange as lead, green/red only for right/wrong
   TYPE Zen Kaku Gothic New for Japanese + Inter for English
   LAYOUT laptop: card left, sticky answer sheet right; phone: tabs, card, sheet below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16120f);--ink:light-dark(#1d1a17,#efe8e2);--mut:light-dark(#6b625b,#b3a89f);--or:light-dark(#d9532b,#ff8a63);--pale:light-dark(#fff3ed,#2a1c16);--line:light-dark(#f0c9b8,#5a3527);--card:light-dark(#ffffff,#1e1814);--ok:light-dark(#1d7f53,#5fd19a);--ng:light-dark(#c2302a,#ff7a70);--fill:light-dark(#2a2522,#f3ece6)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Zen Kaku Gothic New",Inter,sans-serif;margin:0}
button,select{font:inherit;color:inherit}
.top{background:var(--or);color:#fff;padding:20px max(4vw,16px) 0}
.top h1{font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:6px 0 14px;font-size:14px;opacity:.92}
.tabs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:0}
.tab{flex:none;scroll-snap-align:start;border:0;background:color-mix(in srgb,#fff 18%,transparent);color:#fff;border-radius:10px 10px 0 0;padding:10px 14px 9px;cursor:pointer;min-height:44px;text-align:left;line-height:1.25}
.tab b{display:block;font-size:15px}
.tab span{font-size:13px;opacity:.9}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
.tab[aria-selected=true] span{color:var(--mut);opacity:1}
.tab:focus-visible,.btn:focus-visible,.ch:focus-visible,.sq:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 40px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.meta h2{font-size:24px}
.meta small{color:var(--mut);font-size:14px;white-space:nowrap}
.dir{color:var(--mut);font-size:14px;margin:6px 0 16px}
.btn{border:1.5px solid var(--or);background:transparent;color:var(--or);border-radius:999px;padding:9px 18px;min-height:44px;cursor:pointer;font-weight:600}
.btn.solid{background:var(--or);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;min-height:44px;font-size:16px}
.note{font-size:13px;color:var(--mut)}
.text{white-space:pre-wrap;background:var(--pale);border-radius:10px;padding:18px 20px;margin-bottom:18px;font-size:16px;line-height:1.7}
.text h4{margin:0 0 6px;font-size:14px;color:var(--or)}
.text+.text{margin-top:-6px}
.blank{display:inline-block;border-bottom:2px solid var(--or);padding:0 6px;font-weight:700;color:var(--or);white-space:nowrap}
.q{border-top:1px solid var(--line);padding:16px 0 4px}
.q:first-of-type{border-top:0}
.qt{font-weight:600;margin:0 0 10px;white-space:pre-line}
.qt b{color:var(--or);margin-right:6px;white-space:nowrap}
.chs{display:grid;gap:8px}
.chs.row{grid-template-columns:repeat(auto-fit,minmax(64px,90px))}
.ch{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:48px;cursor:pointer}
.ch:hover:not(:disabled){background:var(--pale)}
.ch:disabled{cursor:default}
.row .ch{justify-content:center;padding:8px}
.ov{flex:none;width:30px;height:38px;border:2px solid var(--or);border-radius:50%;display:grid;place-items:center;font:700 14px Inter,sans-serif;color:var(--or)}
.ch.sel .ov{background:var(--fill);border-color:var(--fill);color:var(--bg)}
.ch.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ch.wrong{border-color:var(--ng)}
.fb{margin:10px 0 6px;padding:10px 14px;border-radius:8px;font-size:15px;background:var(--pale)}
.fb strong.ok{color:var(--ok)}
.fb strong.ng{color:var(--ng)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.sheet{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.sheet h3{font-size:18px}
.score{font:700 clamp(34px,5vw,44px)/1.1 Inter,sans-serif;margin:8px 0 2px;color:var(--or)}
.score small{font-size:16px;color:var(--mut);font-weight:600}
.rows{margin:14px 0;max-height:52vh;overflow-y:auto;border-top:1px solid var(--line)}
.sq{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:4px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;cursor:pointer;min-height:40px}
.sq.cur{background:var(--pale)}
.sq>b{font:600 14px Inter,sans-serif;text-align:right;padding-right:6px;color:var(--or)}
.bub{display:flex;gap:6px}
.bub i{width:20px;height:26px;border:1.5px solid var(--or);border-radius:50%;font:600 11px/23px Inter,sans-serif;font-style:normal;color:var(--or);text-align:center}
.bub i.on{background:var(--fill);border-color:var(--fill);color:var(--bg)}
.mk{font-weight:700;font-size:15px}
.mk.ok{color:var(--ok)}
.mk.ng{color:var(--ng)}
.modes{display:inline-flex;gap:4px;background:color-mix(in srgb,#000 14%,transparent);border-radius:999px;padding:4px;margin:0 0 14px}
.mode{border:0;background:transparent;color:#fff;border-radius:999px;padding:8px 20px;min-height:40px;cursor:pointer;font-weight:700;font-size:15px}
.mode[aria-pressed=true]{background:#fff;color:var(--or)}
.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.sub .btn{padding:7px 16px;min-height:40px}
.sub .btn[aria-pressed=true]{background:var(--or);color:#fff}
.fc{background:var(--pale);border-radius:14px;padding:clamp(22px,4vw,40px);min-height:260px;display:grid;align-content:center;justify-items:center;text-align:center;gap:10px;position:relative}
.fc .en{font:700 clamp(30px,5vw,44px)/1.15 Inter,sans-serif;letter-spacing:-.01em;overflow-wrap:anywhere}
.fc .pos{font-size:14px;color:var(--mut)}
.fc .ja{font-size:22px;font-weight:700;color:var(--or)}
.fc .ex{font-size:16px;color:var(--ink);max-width:36em}
.fc .cnt{position:absolute;top:12px;right:16px;font-size:13px;color:var(--mut)}
.fc .tag{position:absolute;top:12px;left:16px;font-size:13px;color:var(--ok);font-weight:700}
.row2{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);cursor:pointer;min-height:40px}
.chk input{width:18px;height:18px;accent-color:var(--or)}
.srch{width:100%;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
.vl{list-style:none;margin:0;padding:0}
.vl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 2px}
.vl b{font-family:Inter,sans-serif;font-size:17px}
.vl .m{color:var(--or);font-weight:700;margin-left:8px}
.vl .p{color:var(--mut);font-size:13px;margin-left:6px}
.vl .x{display:block;font-size:14px;color:var(--mut)}
.kn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:13px;color:var(--mut);white-space:nowrap}
.kn[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:10px;background:var(--pale);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--or);border-radius:99px}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid var(--line);padding:8px 4px}
.stat.on{background:var(--pale)}
.stat b{display:inline-block;min-width:3.2em;text-align:right;color:var(--or);font-variant-numeric:tabular-nums}
.nt{display:block;margin-top:6px;text-align:left;font-size:15px;line-height:1.6}
.nt b,.nb{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--or);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
.eg{display:block;margin-top:6px;padding-left:10px;border-left:3px solid var(--or);font-family:Inter,sans-serif}
.eg i,.ex i.j{display:block;font-style:normal;font-size:14px;color:var(--mut);font-family:"Zen Kaku Gothic New",sans-serif}
.vl .eg2{color:var(--ink)}
.fc .nt{max-width:36em;background:var(--card);border-radius:8px;padding:10px 14px}
.foot{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px) 32px;font-size:13px;color:var(--mut)}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.sheet{position:static}.rows{max-height:none}}
@media(prefers-reduced-motion:no-preference){.ch .ov{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <h1>TOEIC形式 練習問題</h1>
  <p>テスト：リーディング全100問（本番と同じ量）／勉強：頻出単語100語・熟語50個。すべてオリジナル（非公式）。</p>
  <div class="modes" id="modes" role="group" aria-label="モード"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="パート選択"></nav>
</header>
<main class="wrap">
  <article class="card" id="card" aria-live="polite"></article>
  <aside class="sheet" id="sheet" aria-label="解答用紙"></aside>
</main>
<p class="foot">問題はすべてこのアプリ用に作成したオリジナルで、ETSおよびIIBCとは関係ありません。TOEICはETSの登録商標です。解答と「覚えた」の記録はこのブラウザにだけ保存されます。</p>

};

const renderCard=()=>{
  const pi=st.part,p=P[pi],si=st.set[pi],s=p.sets[si];
    const end=s.start+s.q.length-1;
  let h=`<div class="meta"><h2>${p.name}　${p.jp}</h2><small>No. ${s.start}${end>s.start?'–'+end:''}　（${si+1} / ${p.sets.length}）</small></div><p class="dir">${p.dir}</p>`;
  if(s.tx){
    const parts=s.tx.split(/\n(?=\[[^\]\n]*[A-Za-z][^\]\n]*\]\n)/);
    h+=parts.map(t=>{let head='';t=t.replace(/^\[([^\]\n]*[A-Za-z][^\]\n]*)\]\n/,(m,a)=>{head=`<h4>${esc(a)}</h4>`;return ''});
      return `<div class="text">${head}${esc(t).replace(/\{(\d)\}/g,(m,d)=>`<span class="blank">${s.start+ +d}</span>`)}</div>`}).join('');
  }
  s.q.forEach((x,qi)=>{
    const no=s.start+qi,v=st.ans[k(pi,si,qi)],done=v!=null;
    const letters=!x.c;
    const n=letters?p.n:x.c.length;
    const title=x.t?esc(x.t):(s.tx?'空所に入る最も適切なものを選んでください。':'');
    h+=`<section class="q"><p class="qt"><b>No. ${no}</b>${title}</p><div class="chs${letters?' row':''}">`;
    for(let c=0;c<n;c++){
      let cls='ch';if(done){if(c===v)cls+=' sel';if(c===x.a)cls+=' right';else if(c===v)cls+=' wrong'}
      h+=`<button class="${cls}" data-q="${qi}" data-c="${c}"${done?' disabled':''} aria-label="No. ${no} ${L[c]}"><span class="ov">${L[c]}</span>${letters?'':`<span>${esc(x.c[c])}</span>`}</button>`;
    }
    h+='</div>';
    if(done)h+=`<div class="fb">${v===x.a?'<strong class="ok">正解</strong>':`<strong class="ng">不正解</strong>　正解は (${L[x.a]})`}<span class="nt"><b>解説</b>${esc(x.e)}</span></div>`;
    h+='</section>';
  });

  card.innerHTML=h;
};

    h+=`<div class="fc">${isK(d,it)?'<span class="tag">覚えた ✓</span>':''}<span class="cnt">${i+1} / ${pl.length}</span><div class="en">${esc(it.en)}</div>`;
    h+=flip?`${it.pos!=='熟語'?`<div class="pos">${esc(it.pos)}</div>`:''}<div class="ja">${esc(it.ja)}</div><div class="ex">${esc(it.ex)}<i class="j">${esc(it.exj)}</i></div>${noteHTML(it)}<div class="pos">${wacc(d,it)}</div>`:`<p class="note">意味を思い浮かべてから「意味を見る」を押してください。</p>`;
    h+=`</div><div class="row2">`+(flip?`<button class="btn" id="cNo">まだ</button><button class="btn solid" id="cYes">覚えた</button>`:`<button class="btn" id="cPrev">← 前</button><button class="btn solid" id="cFlip">意味を見る</button><button class="btn" id="cNext">次 →</button>`)+`</div>`;
  }else if(st.sm==='quiz'){
    if(!qz||!pl.includes(qz.it))newQuiz();
    const it=qz.it,done=qz.pick!=null;
    h+=`<div class="fc" style="min-height:160px"><span class="cnt">正答率 ${pct(st.qr[d].r,st.qr[d].n)}（${st.qr[d].r}/${st.qr[d].n}）</span><div class="en">${esc(it.en)}</div>${done?`<div class="ex">${esc(it.ex)}<i class="j">${esc(it.exj)}</i></div>`:'<p class="note">意味として正しいものを選んでください。</p>'}</div><div class="chs" style="margin-top:14px">`;
    qz.opts.forEach((o,c)=>{let cls='ch';if(done){if(o===it)cls+=' right';else if(c===qz.pick)cls+=' wrong sel'}h+=`<button class="${cls}" data-o="${c}"${done?' disabled':''}><span class="ov">${L[c]}</span><span>${esc(o.ja)}</span></button>`});
    h+='</div>';
    if(done)h+=`<div class="fb">${qz.opts[qz.pick]===it?'<strong class="ok">正解</strong>':`<strong class="ng">不正解</strong>　正解は「${esc(it.ja)}」`}　<span class="note">この語の${wacc(d,it)}</span>${noteHTML(it)}</div><div class="row2">${isK(d,it)?'':`<button class="btn" id="qK">覚えたにする</button>`}<button class="btn solid" id="qNext">次の問題 →</button></div>`;
  }else{
    h+=`<input class="srch" id="srch" type="search" placeholder="英語か日本語で検索" value="${esc(term)}" aria-label="検索"><div id="vlist">${listHTML()}</div>`;
  }
  card.innerHTML=h;
};
const renderSSheet=()=>{
  const d=st.deck,dk=D[d],n=kc(d),pc=Math.round(n/dk.items.length*100);
  sheet.innerHTML=`<h3>学習の記録　${dk.name}</h3><div class="score">${n}<small> / ${dk.items.length} 覚えた</small></div><div class="bar"><i style="width:${pc}%"></i></div><p class="note" style="margin:0 0 12px">覚えた割合 ${pc}%</p><h3 style="font-size:15px;margin-top:6px">4択クイズの正答率</h3>${D.map((x,i)=>`<div class="stat${i===d?' on':''}"><span>${x.name}</span><span>${st.qr[i].r}/${st.qr[i].n} 問　<b>${pct(st.qr[i].r,st.qr[i].n)}</b></span></div>`).join('')}<h3 style="font-size:15px;margin-top:14px">覚えた語</h3>${D.map((x,i)=>`<div class="stat${i===d?' on':''}"><span>${x.name}</span><span>${kc(i)} / ${x.items.length}</span></div>`).join('')}<button class="btn" id="kReset" style="width:100%;margin-top:14px">${confirmReset?'もう一度押すとリセット':`${dk.name}の記録をリセット`}</button>`;
};
const setK=(d,it,v)=>{const key=kk(d,it);if(v)st.known[key]=1;else delete st.known[key];save()};
const studyRender=()=>{renderSTabs();renderStudy();renderSSheet()};
const studyClick=e=>{
  const d=st.deck,pl=pool(d),t=e.target.closest('button');if(!t)return;
  const sm=t.dataset.sm;if(sm){st.sm=sm;flip=false;save();studyRender();return}
  const cur=()=>pl[st.ci[d]%pl.length];
  if(t.id==='cFlip'){flip=true;renderStudy();return}
  if(t.id==='cNext'||t.id==='cPrev'){st.ci[d]=(st.ci[d]+(t.id==='cNext'?1:pl.length-1))%pl.length;flip=false;save();renderStudy();return}
  if(t.id==='cYes'||t.id==='cNo'){
    const it=cur(),yes=t.id==='cYes';setK(d,it,yes);flip=false;
    if(!(st.only&&yes))st.ci[d]=st.ci[d]+1;
    const np=pool(d).length;st.ci[d]=np?st.ci[d]%np:0;save();studyRender();return}
  if(t.dataset.o!=null&&qz&&qz.pick==null){qz.pick=+t.dataset.o;const ok=qz.opts[qz.pick]===qz.it,key=kk(d,qz.it),w=st.wr[key]||[0,0];w[1]++;if(ok)w[0]++;st.wr[key]=w;st.qr[d].n++;if(ok)st.qr[d].r++;save();renderSTabs();renderStudy();renderSSheet();return}
  if(t.id==='qK'){setK(d,qz.it,true);renderSTabs();renderStudy();renderSSheet();return}
  if(t.id==='qNext'){newQuiz();renderStudy();return}
  if(t.dataset.k!=null){const it=D[d].items.find(x=>x.en===t.dataset.k);setK(d,it,!isK(d,it));renderSTabs();document.getElementById('vlist').innerHTML=listHTML();renderSSheet();return}
};
card.addEventListener('input',e=>{if(st.mode==='study'&&e.target.id==='srch'){term=e.target.value;document.getElementById('vlist').innerHTML=listHTML()}});
card.addEventListener('change',e=>{if(st.mode==='study'&&e.target.id==='only'){st.only=e.target.checked;st.ci[st.deck]=0;flip=false;qz=null;save();studyRender()}});
modes.addEventListener('click',e=>{const b=e.target.closest('.mode');if(!b||b.dataset.m===st.mode)return;st.mode=b.dataset.m;confirmReset=false;save();render()});

let confirmReset=false;
const renderSheet=()=>{
  const pi=st.part,p=P[pi],sc=partScore(pi);
  let rows='';
  p.sets.forEach((s,si)=>s.q.forEach((x,qi)=>{
    const v=st.ans[k(pi,si,qi)],n=x.c?x.c.length:p.n;
    let b='';for(let c=0;c<n;c++)b+=`<i class="${v===c?'on':''}">${L[c]}</i>`;
    const mk=v==null?'':v===x.a?'<span class="mk ok">○</span>':'<span class="mk ng">×</span>';
    rows+=`<button class="sq${si===st.set[pi]?' cur':''}" data-s="${si}" aria-label="No. ${s.start+qi}へ"><b>${s.start+qi}</b><span class="bub">${b}</span>${mk||'<span></span>'}</button>`;
  }));
  const all=P.reduce((t,_,i)=>{const s=partScore(i);t.a+=s.a;t.c+=s.c;return t},{a:0,c:0});
  const tot=P.reduce((t,p)=>t+p.total,0);
  const tbl=P.map((x,i)=>{const t=partScore(i);return `<div class="stat${i===pi?' on':''}"><span>${x.name}</span><span>${t.c}/${t.a} 問　<b>${pct(t.c,t.a)}</b></span></div>`}).join('')+`<div class="stat"><span>全体</span><span>${all.c}/${all.a} 問　<b>${pct(all.c,all.a)}</b></span></div>`;
  sheet.innerHTML=`<h3>解答用紙　${p.name}</h3><div class="score">${pct(sc.c,sc.a)}<small> 正答率</small></div><p class="note" style="margin:0 0 10px">${p.name}：解答 ${sc.a} / ${p.total} 問中 ${sc.c} 問正解</p>${tbl}<div class="rows">${rows}</div><button class="btn" id="reset" style="width:100%">${confirmReset?'もう一度押すとリセット':'このパートをやり直す'}</button>`;
};

const render=()=>{renderModes();if(st.mode==='study'){studyRender();return}renderTabs();renderCard();renderSheet()};
const go=(pi,si)=>{stop();confirmReset=false;st.part=pi;st.set[pi]=si;save();render();if(card.getBoundingClientRect().top<0)card.scrollIntoView({block:'start'});};
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b&&st.mode==='study'){st.deck=+b.dataset.d;flip=false;qz=null;term='';confirmReset=false;save();render();return}if(b){go(+b.dataset.p,st.set[+b.dataset.p]);b.scrollIntoView({inline:'nearest',block:'nearest'})}});
tabs.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;if(st.mode==='study'){st.deck=1-st.deck;flip=false;qz=null;save();render();document.getElementById('tab'+st.deck)?.focus();return}const n=(st.part+(e.key==='ArrowRight'?1:P.length-1))%P.length;go(n,st.set[n]);document.getElementById('tab'+n)?.focus()});
card.addEventListener('click',e=>{
  if(st.mode==='study'){studyClick(e);return}
  const pi=st.part,si=st.set[pi],p=P[pi],s=p.sets[si];
  const ch=e.target.closest('.ch');
  if(ch&&!ch.disabled){st.ans[k(pi,si,+ch.dataset.q)]=+ch.dataset.c;save();renderTabs();renderCard();renderSheet();
    const fb=card.querySelectorAll('.q')[+ch.dataset.q]?.querySelector('.fb');fb?.scrollIntoView({block:'nearest'});return}
  if(e.target.id==='prev'){if(si>0)go(pi,si-1);else go(pi-1,P[pi-1].sets.length-1)}
  if(e.target.id==='next'){if(si<p.sets.length-1)go(pi,si+1);else go(pi+1,0)}
});
sheet.addEventListener('click',e=>{
  if(st.mode==='study'){if(e.target.id==='kReset'){if(!confirmReset){confirmReset=true;renderSSheet();return}Object.keys(st.known).forEach(x=>{if(x.startsWith(st.deck+':'))delete st.known[x]});Object.keys(st.wr).forEach(x=>{if(x.startsWith(st.deck+':'))delete st.wr[x]});st.qr[st.deck]={r:0,n:0};confirmReset=false;st.ci[st.deck]=0;save();studyRender()}return}
  const r=e.target.closest('.sq');if(r){go(st.part,+r.dataset.s);return}
  if(e.target.id==='reset'){
    if(!confirmReset){confirmReset=true;renderSheet();return}
    const pi=st.part;Object.keys(st.ans).forEach(x=>{if(x.startsWith(pi+'-'))delete st.ans[x]});
    confirmReset=false;st.set[pi]=0;save();render();
  }
});
render();
}
</script>
</body>
</html>
